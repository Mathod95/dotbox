# Généré par dotbox init: ne pas modifier, il est réécrit à chaque init.
# Vos changements vont dans compose.override.yml, à côté.
name: crowdsec
services:
  crowdsec:
    image: <crowdsec>
    container_name: crowdsec
    restart: unless-stopped
    depends_on:
      - socket-proxy
    networks:
      - dotbox
      - logs
    ports:
      # L'API locale, pour le bouncer pare-feu du système: sur 127.0.0.1, jamais sur Internet.
      - "127.0.0.1:8080:8080"
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/traefik crowdsecurity/whitelist-good-actors crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
    volumes:
      - /opt/crowdsec/config:/etc/crowdsec
      - /opt/crowdsec/data:/var/lib/crowdsec/data
      # Les connexions SSH, dans le journal du système (Debian 13 n'écrit plus auth.log).
      - /var/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Le log d'accès de Traefik.
      - /opt/traefik/logs:/var/log/traefik:ro
    # Les clés des bouncers: l'image les enregistre au démarrage (« firewall » et « traefik »).
    secrets:
      - bouncer_key_firewall
      - bouncer_key_traefik
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Les logs des apps sans Authelia, pour leurs scénarios de force brute (10.9, D72). Son propre
  # proxy, en lecture seule: celui de Traefik ne donne pas les logs, et Traefik n'en a pas besoin.
  socket-proxy:
    image: <socket-proxy>
    container_name: crowdsec-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      ALLOW_LOGS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      - logs
    security_opt:
      - no-new-privileges:true

secrets:
  bouncer_key_firewall:
    file: /opt/dotbox/secrets/crowdsec_bouncer_firewall
  bouncer_key_traefik:
    file: /opt/dotbox/secrets/crowdsec_bouncer_traefik

networks:
  dotbox:
    external: true
  logs:
    internal: true
