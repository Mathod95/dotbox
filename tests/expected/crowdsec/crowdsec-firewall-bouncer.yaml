# Généré par dotbox init: ne pas modifier, il est réécrit à chaque init.
# La configuration de la release <version>, en mode iptables (iptables-nft, comme Docker),
# sur les chaînes INPUT (SSH) et DOCKER-USER (Traefik et les ports des apps).
mode: iptables
update_frequency: 10s
log_mode: file
log_dir: /var/log/
log_level: info
log_compression: true
log_max_size: 100
log_max_backups: 3
log_max_age: 30
api_url: http://127.0.0.1:8080/
api_key: KEY
insecure_skip_verify: false
disable_ipv6: false
deny_action: DROP
deny_log: false
supported_decisions_types:
  - ban
blacklists_ipv4: crowdsec-blacklists
blacklists_ipv6: crowdsec6-blacklists
ipset_type: nethash
iptables_chains:
  - INPUT
  - DOCKER-USER
iptables_add_rule_comments: true
