# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: radarr
services:
  radarr:
    image: lscr.io/linuxserver/radarr:<version>
    container_name: radarr
    restart: unless-stopped
    networks:
      - dotbox
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: 'Europe/Paris'
    volumes:
      - /opt/radarr/config:/config
      - /data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.radarr.rule: Host(`radarr.example.com`)
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.services.radarr.loadbalancer.server.port: "7878"
      # two_factor: Authelia demande qui se connecte avant de laisser passer
      traefik.http.routers.radarr.middlewares: authelia@docker

networks:
  dotbox:
    external: true
