# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: homarr
services:
  homarr:
    image: ghcr.io/homarr-labs/homarr:<version>
    container_name: homarr
    restart: unless-stopped
    networks:
      - dotbox
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: 'Europe/Paris'
      SECRET_ENCRYPTION_KEY_FILE: '/run/secrets/encryption_key'
    volumes:
      - /opt/homarr/config:/appdata
      - /opt/dotbox/secrets/homarr_encryption_key:/run/secrets/encryption_key:ro
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.homarr.rule: Host(`homarr.example.com`)
      traefik.http.routers.homarr.entrypoints: websecure
      traefik.http.services.homarr.loadbalancer.server.port: "7575"
      # two_factor: Authelia demande qui se connecte avant de laisser passer
      traefik.http.routers.homarr.middlewares: authelia@docker

networks:
  dotbox:
    external: true
