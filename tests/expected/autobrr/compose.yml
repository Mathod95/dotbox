# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: autobrr
services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:<version>
    container_name: autobrr
    restart: unless-stopped
    networks:
      - dotbox
    user: "1000:1000"
    environment:
      TZ: 'Europe/Paris'
    volumes:
      - /opt/autobrr/config:/config
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7474/api/healthz/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.autobrr.rule: Host(`autobrr.example.com`)
      traefik.http.routers.autobrr.entrypoints: websecure
      traefik.http.services.autobrr.loadbalancer.server.port: "7474"
      # two_factor: Authelia demande qui se connecte avant de laisser passer
      traefik.http.routers.autobrr.middlewares: authelia@docker

networks:
  dotbox:
    external: true
