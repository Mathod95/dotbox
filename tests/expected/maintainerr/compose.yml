# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: maintainerr
services:
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:<version>
    container_name: maintainerr
    restart: unless-stopped
    networks:
      - dotbox
    user: "1000:1000"
    environment:
      TZ: 'Europe/Paris'
    volumes:
      - /opt/maintainerr/data:/opt/data
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.maintainerr.rule: Host(`maintainerr.example.com`)
      traefik.http.routers.maintainerr.entrypoints: websecure
      traefik.http.services.maintainerr.loadbalancer.server.port: "6246"
      # two_factor: Authelia demande qui se connecte avant de laisser passer
      traefik.http.routers.maintainerr.middlewares: authelia@docker

networks:
  dotbox:
    external: true
