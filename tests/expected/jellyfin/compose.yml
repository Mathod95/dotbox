# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: jellyfin
services:
  jellyfin:
    image: jellyfin/jellyfin:<version>
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - dotbox
    user: "1000:1000"
    environment:
      TZ: 'Europe/Paris'
      JELLYFIN_PublishedServerUrl: 'https://jellyfin.example.com'
    volumes:
      - /opt/jellyfin/config:/config
      - /opt/jellyfin/cache:/cache
      - /data/media:/data/media:ro
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.example.com`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      # app: AppSec, le WAF de CrowdSec, bloque les attaques connues
      traefik.http.routers.jellyfin.middlewares: crowdsec@docker

networks:
  dotbox:
    external: true
