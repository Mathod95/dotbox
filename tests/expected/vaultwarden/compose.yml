# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:<version>
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - dotbox
    user: "1000:1000"
    environment:
      TZ: 'Europe/Paris'
      ROCKET_PORT: '8080'
      DOMAIN: 'https://vaultwarden.example.com'
      SIGNUPS_ALLOWED: 'false'
      INVITATIONS_ALLOWED: 'true'
      DISABLE_ADMIN_TOKEN: 'true'
    volumes:
      - /opt/vaultwarden/data:/data
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.vaultwarden.rule: Host(`vaultwarden.example.com`)
      traefik.http.routers.vaultwarden.entrypoints: websecure
      traefik.http.services.vaultwarden.loadbalancer.server.port: "8080"
      # app: AppSec, le WAF de CrowdSec, bloque les attaques connues
      traefik.http.routers.vaultwarden.middlewares: crowdsec@docker
      # /admin: derrière Authelia, en plus
      traefik.http.routers.vaultwarden-admin.rule: Host(`vaultwarden.example.com`) && PathPrefix(`/admin`)
      traefik.http.routers.vaultwarden-admin.entrypoints: websecure
      traefik.http.routers.vaultwarden-admin.service: vaultwarden
      traefik.http.routers.vaultwarden-admin.middlewares: authelia@docker

networks:
  dotbox:
    external: true
