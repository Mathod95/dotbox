# Généré par dotbox install: ne pas modifier, il est réécrit à chaque install.
# Vos changements vont dans compose.override.yml, à côté.
name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:<version>
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - dotbox
    user: "1000:1000"
    environment:
      TZ: 'Europe/Paris'
    volumes:
      - /opt/uptime-kuma/data:/app/data
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: Host(`uptime-kuma.example.com`)
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"
      # two_factor: Authelia demande qui se connecte avant de laisser passer
      traefik.http.routers.uptime-kuma.middlewares: authelia@docker

networks:
  dotbox:
    external: true
