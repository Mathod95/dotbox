name: Catalog hashes

# Renovate change la version du bouncer pare-feu (catalog/core/crowdsec.yml) ou du plugin de
# Traefik (catalog/core/crowdsec-plugin.yml), mais il ne sait pas calculer leurs empreintes
# (Journal, 7.14 et 10.7). Ce workflow les calcule (tools/core_hashes.sh), les ajoute dans la
# branche de la pull request, puis relance la CI du catalogue sur ce nouveau commit.
on:
  pull_request:
    paths:
      - "catalog/core/crowdsec.yml"
      - "catalog/core/crowdsec-plugin.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-hashes-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  hashes:
    # renovate/: les pull requests de Renovate. test/catalog-hashes: le test du workflow (Journal, 7.14).
    if: (startsWith(github.head_ref, 'renovate/') || github.head_ref == 'test/catalog-hashes') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Les empreintes du bouncer et du plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/core_hashes.sh

      - name: Commit dans la branche de Renovate, puis la CI relancée
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "empreintes déjà à jour"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: sans lui, ce commit déclenche des runs pull_request qui attendent une
          # approbation (action_required). La CI est relancée juste après par workflow_dispatch.
          git commit -am "chore(catalog): empreintes du core [skip ci]"
          git push origin "HEAD:${BRANCH}"
          gh workflow run catalog.yml --ref "${BRANCH}"
