<title>__TITLE__</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%278%27 fill=%27%2310b981%27/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap">
<style>
/* Roadmap de Dot Box : gabarit de la releasePage (docs/design/releasePage.html), mêmes valeurs.
   Titre ROADMAP en points, puis une seule liste de features à cocher, sans version : les versions vivent dans Releases.
   Données : tools/site/roadmap.json. Un seul thème sombre. */
:root {
  --bg: #080808;
  --panel: #0e0e0e;
  --line: #1f1f1f;
  --lit: #f2f0e9;
  --label: #b8b6b0;
  --muted: #7d7b76;
  --accent: #10b981;
  --new: #10b981;
  --changed: #5aa9e6;
  --fixed: #f5b942;
  --planned: #a78bfa;
  --done: #10b981;
  --progress: #f5b942;
  --removed: #7d7b76;
  --mono: "Fira Code", "Cascadia Mono", Consolas, monospace;
  --brand: "Segoe UI", Selawik, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-behavior: smooth; scrollbar-gutter: stable; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--lit);
  font-family: var(--brand); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px);
  background-size: 22px 22px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 48px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* en-tête (identique à Dot Page) */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; height: 42px; font-weight: 700; letter-spacing: .22em; font-size: 15px; color: var(--lit); text-decoration: none; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.topr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.ext { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); text-decoration: none; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.ext:hover { color: var(--lit); border-color: #333; }
.ext[aria-current="page"] { color: var(--bg); background: var(--lit); border-color: var(--lit); }
.lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.chip { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--bg); color: var(--label); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--lit); color: var(--bg); }

/* titre */
.hero { display: grid; gap: 18px; }
.hero canvas { display: block; max-width: min(100%, 760px); height: auto; justify-self: start; }
.lede { margin: 0; font-family: var(--mono); font-size: clamp(15px, 1.8vw, 19px); color: var(--lit); text-wrap: balance; }
.lede i { font-style: normal; color: var(--accent); padding: 0 .5em; }

/* la liste */
.list { display: grid; gap: 18px; padding: clamp(20px, 3vw, 30px); border: 1px solid var(--line); border-radius: 20px; background: var(--panel); min-width: 0; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
.legend li { display: inline-flex; align-items: center; gap: 8px; }
.legend li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.legend b { color: var(--lit); font-weight: 500; }
.count { font-family: var(--mono); font-size: 13px; letter-spacing: .1em; color: var(--lit); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.dots li { width: 10px; height: 10px; border-radius: 50%; background: #262626; }
.dots li.done { background: var(--done); }
.dots li.progress { background: var(--progress); }
.items { margin: 0; padding: 0; list-style: none; display: grid; }
.items li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); color: var(--label); font-size: 15px; }
.items li:first-child { border-top: 0; }
/* case à cocher : vide (à faire), à moitié (en cours), pleine avec ✓ (fait) */
.box { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #3a3a3a; font-family: var(--mono); font-size: 12px; line-height: 1; color: var(--bg); }
.done .box { background: var(--done); border-color: var(--done); }
.progress .box { border-color: var(--progress); background: linear-gradient(90deg, var(--progress) 50%, transparent 50%); }
.items li.done .txt { color: var(--muted); }
.items .meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
.items .tag { color: var(--label); padding: 2px 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.items .spec { color: var(--accent); text-decoration: none; white-space: nowrap; }
.items .spec:hover { color: var(--lit); }
code { font-family: var(--mono); font-size: .88em; color: var(--lit); background: #161616; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
@media (max-width: 640px) { .items li { grid-template-columns: auto minmax(0, 1fr); } .items .meta { grid-column: 2; justify-content: flex-start; } }

.footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-family: var(--mono); font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
.footer .red { color: var(--accent); }
.footer a { color: var(--label); text-decoration: none; }
</style>
<div class="wrap">
  <div class="top">
    <a class="brand" href="__HOME__"__HOME_TARGET__>DOT BOX</a>
    <div class="topr">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" class="chip" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" class="chip" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="ext" href="__GS__"__GS_TARGET__>Getting Started</a>
      <a class="ext" href="#" aria-current="page">Roadmap</a>
      <a class="ext" href="__RELEASES__"__RELEASES_TARGET__>Releases</a>
      <a class="ext" href="https://github.com/Mathod95/dotbox" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>

  <section class="hero" aria-labelledby="title">
    <h1 id="title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Roadmap</h1>
    <canvas id="titleDots" width="1800" height="260" aria-hidden="true"></canvas>
    <p class="lede" data-i18n-html="lede"></p>
  </section>

  <main class="list">
    <div class="list-head">
      <span class="count" id="count"></span>
      <ul class="legend" id="legend"></ul>
    </div>
    <ul class="dots" id="dots" aria-hidden="true"></ul>
    <ul class="items" id="items"></ul>
  </main>

  <footer class="footer">
    <span class="red">Self-hosted · Rust · Docker Compose</span>
    <a href="https://github.com/Mathod95/dotbox" target="_blank" rel="noopener">Mathod95/dotbox</a>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script id="docs" type="application/json">__DOCURLS__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var DOCS = JSON.parse(document.getElementById("docs").textContent);
  var BLANK = __DOCBLANK__;

  var STR = {
    fr: {
      lede: "Ce qui est prévu pour Dot Box<i>●</i>coché au fur et à mesure, les versions sont dans Releases.",
      done: "Fait", progress: "En cours", planned: "À faire", of: "faites sur", spec: "Spec ↗"
    },
    en: {
      lede: "What is planned for Dot Box<i>●</i>checked off as it ships, versions are in Releases.",
      done: "Done", progress: "In progress", planned: "To do", of: "done out of", spec: "Spec ↗"
    }
  };
  var STATES = ["done", "progress", "planned"];
  var lang = "en";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    lang = q === "en" || q === "fr" ? q : localStorage.getItem("dotbox-lang") || ((navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en"); // français pour un navigateur en français, anglais sinon
  } catch (e) { lang = (navigator.language || "en").slice(0, 2) === "fr" ? "fr" : "en"; }
  if (!STR[lang]) lang = "en";
  function t(k) { return STR[lang][k]; }
  function tr(o) { return o && (o[lang] || o.fr) || ""; }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  var DOM = {}; D.domains.forEach(function (d) { DOM[d.id] = d; });

  // titre ROADMAP en points (police 5 × 7 de Dot Page)
  var F = {
    R: ["####.", "#...#", "#...#", "####.", "#.#..", "#..#.", "#...#"],
    O: [".###.", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."],
    A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
    D: ["####.", "#...#", "#...#", "#...#", "#...#", "#...#", "####."],
    M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"],
    P: ["####.", "#...#", "#...#", "####.", "#....", "#....", "#...."]
  };
  function drawTitle(text) {
    var cv = document.getElementById("titleDots"), ctx = cv.getContext("2d"), cols = [];
    text.split("").forEach(function (ch, i) {
      var g = F[ch];
      for (var c = 0; c < g[0].length; c++) cols.push(g.map(function (r) { return r[c] === "#"; }));
      if (i < text.length - 1) cols.push([false, false, false, false, false, false, false]);
    });
    var pad = 1, total = cols.length + pad * 2, rows = 7 + pad * 2;
    // points tous les 14 px, comme la page Releases
    cv.width = total * 14 * 2; cv.style.width = total * 14 + "px";
    var pitch = cv.width / total, r = pitch * 0.36;
    cv.height = Math.round(rows * pitch);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var x = 0; x < total; x++) for (var y = 0; y < rows; y++) {
      var col = cols[x - pad], on = col && y >= pad && y < 7 + pad && col[y - pad];
      ctx.beginPath(); ctx.fillStyle = on ? "#f2f0e9" : "#171717";
      ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, on ? r : r * 0.8, 0, Math.PI * 2); ctx.fill();
    }
  }

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n-html]").forEach(function (e) { e.innerHTML = t(e.getAttribute("data-i18n-html")); });
    document.querySelectorAll(".lang .chip").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    var F_ = D.features, n = function (s) { return F_.filter(function (f) { return f.status === s; }).length; };

    document.getElementById("count").textContent = n("done") + " " + t("of") + " " + F_.length;
    var legend = document.getElementById("legend"); legend.innerHTML = "";
    STATES.forEach(function (s) {
      var li = el("li"); li.style.setProperty("--c", "var(--" + s + ")");
      li.appendChild(el("b", "", String(n(s)))); li.appendChild(document.createTextNode(t(s))); legend.appendChild(li);
    });
    // avancement : un point par feature, allumé quand elle est faite
    var dots = document.getElementById("dots"); dots.innerHTML = "";
    STATES.forEach(function (s) { F_.forEach(function (f) { if (f.status === s) dots.appendChild(el("li", s)); }); });

    // la liste, dans l'ordre de roadmap.json
    var ul = document.getElementById("items"); ul.innerHTML = "";
    F_.forEach(function (f) {
      var li = el("li", f.status); li.setAttribute("title", t(f.status));
      li.appendChild(el("span", "box", f.status === "done" ? "✓" : ""));
      var txt = el("span", "txt"); txt.innerHTML = inline(tr(f)); li.appendChild(txt);
      var meta = el("span", "meta");
      meta.appendChild(el("span", "tag", tr(DOM[f.domain].name)));
      if (f.doc && DOCS[f.doc]) {
        var a = el("a", "spec", t("spec")); a.href = DOCS[f.doc];
        if (BLANK) { a.target = "_blank"; a.rel = "noopener"; }
        meta.appendChild(a);
      }
      li.appendChild(meta); ul.appendChild(li);
    });
  }

  document.querySelectorAll(".lang .chip").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem("dotbox-lang", lang); } catch (e) {} render(); });
  });

  drawTitle("ROADMAP");
  render();
})();
</script>
