/* homePage de Dot Box, v2: gabarit docs/design/homePage.html (repris de xeneon), mêmes valeurs que Dot Page.
   Six zones dans l'ordre: Top, Hero, Showcase, About, List, Footer. Un seul thème sombre. */
:root {
  --bg: #080808;
  --panel: #0e0e0e;
  --line: #1f1f1f;
  --line2: #262626;
  --lit: #f2f0e9;
  --label: #b8b6b0;
  --muted: #7d7b76;
  --unlit: #1c1c1c;
  --accent: #10b981;
  --wip: #f5b942;
  --spec: #a78bfa;
  --design: #5aa9e6;
  --idea: #6b6b6b;
  --pic: 70px; /* taille de tous les pictogrammes 7 × 7 */
  --mono: "Fira Code", "Cascadia Mono", Consolas, monospace;
  --brand: "Segoe UI", Selawik, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scrollbar-gutter: stable; }
body {
  margin: 0; background: var(--bg); color: var(--lit);
  font-family: var(--brand); font-size: 16px; line-height: 1.55;
  background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px);
  background-size: 22px 22px;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 48px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
code { font-family: var(--mono); font-variant-ligatures: none; font-size: .9em; color: var(--lit); }
.pic { display: block; flex: none; width: var(--pic); height: var(--pic); }

/* 1 · Top */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; height: 42px; font-weight: 700; letter-spacing: .22em; font-size: 15px; color: var(--lit); }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.topr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.ext { font-family: var(--mono); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); text-decoration: none; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.ext:hover { color: var(--lit); border-color: #333; }
.lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.lang .chip { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--bg); color: var(--label); cursor: pointer; }
.lang .chip[aria-pressed="true"] { background: var(--lit); color: var(--bg); }

/* 2 · Hero */
.hero { display: grid; gap: 22px; }
.hero canvas { display: block; max-width: min(100%, 760px); height: auto; justify-self: center; }
.tagline { font-family: var(--mono); font-size: clamp(17px, 2.2vw, 24px); margin: 0; color: var(--lit); text-wrap: pretty; }
.tagline i { font-style: normal; color: var(--accent); padding: 0 .5em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.stats b { color: var(--accent); font-weight: 500; font-size: 18px; margin-right: .5em; font-variant-numeric: tabular-nums; }

/* bandeaux de section, boutons */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.bar h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.hint { margin: 0; color: var(--label); font-size: 14px; }

/* 3 · Showcase: l'interface de Dot Box, en maquette interactive */
.showcase { display: grid; gap: 16px; }
.edge { padding: clamp(8px, 1.2vw, 18px); border-radius: clamp(12px, 1.6vw, 24px); background: linear-gradient(180deg, #161616, #0b0b0b); border: 1px solid #2a2a2a; box-shadow: 0 40px 80px -40px #000, inset 0 1px 0 #262626; }
.screen { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; padding: clamp(12px, 1.8vw, 22px); border-radius: clamp(6px, .8vw, 12px); background: #050505; font-family: var(--mono); font-variant-ligatures: none; }
.scr-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.scr-head .dot { display: inline-flex; align-items: center; gap: 8px; }
.scr-head .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.scr-head .ex { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-content: start; }
.tile { position: relative; display: grid; gap: 10px; justify-items: start; padding: 14px; min-width: 0; border: 1.5px solid #1d1d1d; border-radius: 14px; background: transparent; color: var(--lit); text-align: left; font: inherit; cursor: pointer; }
.tile:hover, .tile:focus-visible { border-color: var(--accent); background: #0d0d0d; outline: none; }
.tile .name { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.st::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--idea)); }
.st.run { --c: var(--accent); }
.st.busy { --c: var(--wip); }
.st.off { --c: var(--idea); color: var(--muted); }
.tile.off .pic { opacity: .55; }
.tile[aria-pressed="true"] { border-color: var(--accent); }
.log { display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-width: 0; padding: 14px; border: 1.5px solid #1d1d1d; border-radius: 14px; }
.log-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--label); }
.log-h b { color: var(--lit); font-weight: 500; }
.log ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; align-content: start; font-size: 12px; line-height: 1.5; min-height: 230px; color: var(--label); overflow-wrap: anywhere; }
.log li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); }
.log li .k { color: var(--muted); }
.log li.ok .k, .log li.ok { color: var(--accent); }
.log li.wire .k { color: var(--spec); }
.log li em { font-style: normal; color: var(--lit); }
.log-f { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg); color: var(--label); cursor: pointer; }
.btn:hover { color: var(--lit); border-color: #3a3a3a; }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.go:hover { color: var(--bg); filter: brightness(1.08); }
.btn:disabled { opacity: .4; cursor: default; filter: none; }

/* 4 · About */
.about { display: grid; gap: 22px; padding: clamp(20px, 3vw, 32px); border: 1px solid var(--line2); border-radius: 20px; background: var(--panel); }
.about-head { display: flex; align-items: stretch; gap: 16px; }
.about-head .head { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; flex: 1; height: var(--pic); }
.about-head h2 { margin: 0; font-family: var(--mono); font-weight: 500; font-size: 28px; line-height: 1.15; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); white-space: nowrap; }
.status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idea)); }
.ver { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.about-lead { margin: 0; font-size: clamp(16px, 1.6vw, 19px); color: var(--lit); text-wrap: pretty; }
.about-k { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.part { display: grid; gap: 10px; align-content: start; padding: 20px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.part .ph2 { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.part h3 { margin: 0; font-size: 18px; font-weight: 700; }
.tag2 { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.part p { margin: 0; color: var(--label); font-size: 15px; }
.part .more { justify-self: start; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); text-decoration: none; }
.part .more:hover { color: var(--lit); }
.daily { margin: 0; color: var(--label); font-size: 15px; }
.daily b, .steps b { color: var(--lit); font-weight: 600; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; color: var(--label); font-size: 15px; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--mono); font-weight: 500; font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.links a { text-decoration: none; color: var(--label); }
.links a:hover { color: var(--lit); }
.links a.mock { color: var(--accent); }

/* 5 · List: une carte par app */
.list { display: grid; gap: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.card { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 22px; min-width: 0; border: 1px solid var(--line2); border-radius: 18px; background: var(--panel); }
.card:hover { border-color: var(--accent); }
.card .row { display: flex; align-items: center; gap: 16px; min-width: 0; }
.card .head { display: grid; gap: 2px; min-width: 0; }
.card h3 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .02em; line-height: 1.3; color: var(--lit); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card p { margin: 0; color: var(--label); font-size: 15px; min-width: 0; }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 16px; padding-top: 14px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.foot > * { line-height: 28px; }
.foot a { color: var(--label); text-decoration: none; }
.foot a:hover { color: var(--lit); }
.foot .go { color: var(--accent); margin-right: auto; }
.foot a.gh { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; }
.foot a.gh svg { width: 18px; height: 18px; fill: currentColor; }

/* 6 · Footer */
.footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-family: var(--mono); font-size: 13px; letter-spacing: .24em; text-transform: uppercase; }
.footer .red { color: var(--accent); }
.footer a { color: var(--label); text-decoration: none; }
.footer a:hover { color: var(--lit); }

@media (max-width: 1080px) {
  .screen { grid-template-columns: minmax(0, 1fr); }
  .log ol { min-height: 0; }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

  // ---------- titre en points (police 5 × 7), points tous les 19 px, dernier mot en points éteints sur fond d'accent
  var F = {

  function drawTitle(text) {
    var cv = document.getElementById("titleDots"), ctx = cv.getContext("2d");
    var cols = [], lastWordCol = 0;
    text.split("").forEach(function (ch, i) {
      if (ch === " ") lastWordCol = cols.length + F[" "][0].length;
      var g = F[ch];
      for (var c = 0; c < g[0].length; c++) cols.push(g.map(function (r) { return r[c] === "#"; }));
      if (i < text.length - 1) cols.push([false, false, false, false, false, false, false]);

    var pad = 1, total = cols.length + pad * 2, rows = 7 + pad * 2, accentFrom = lastWordCol + pad;
    cv.width = total * 19 * 2; cv.style.width = total * 19 + "px";
    var pitch = cv.width / total, r = pitch * 0.36;
    cv.height = Math.round(rows * pitch);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var x = 0; x < total; x++) for (var y = 0; y < rows; y++) {
      var col = cols[x - pad], on = col && y >= pad && y < 7 + pad && col[y - pad];
      var inWord = x >= accentFrom, accent = inWord && !on, lit = on && !inWord;
      ctx.beginPath();
      ctx.fillStyle = lit ? LIT: accent ? ACC: "#171717";
      ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, lit || accent ? r: r * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  }

  function app(slug) { for (var i = 0; i < APPS.length; i++) if (APPS[i].slug === slug) return APPS[i]; }
  function renderTiles() {
    tilesEl.innerHTML = "";

      var b = el("button", "tile" + (a.on ? "": " off")); b.type = "button";

  function syncButton() {

  function idleLog() {

  function install() {

      ["", "›", "mkdir /opt/" + a.slug + " (uid 1000)"],
