[package]
name = "dotbox"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted apps on Docker Compose, behind Traefik and Authelia"
repository = "https://github.com/Mathod95/dotbox"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
