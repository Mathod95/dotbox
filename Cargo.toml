[package]
name = "dotbox"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted apps on Docker Compose, behind Traefik and Authelia"
repository = "https://github.com/Mathod95/dotbox"
publish = false

[dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.7"
console = "0.16.6"
indicatif = "0.18.6"
serde_json = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
