# code-server: VS Code dans le navigateur, pour lire et modifier les fichiers des apps.
# Format: Journal, étape 7 (7.1) et 8.9. Les {{...}} sont remplis par dotbox à l'installation.
# L'image officielle du projet (D130, D131), essayée sur le serveur de test en J300.
name: code-server
description: VS Code in the browser
min_dotbox: 0.0.6
image: codercom/code-server:4.146.0
port: 8080
access: two_factor
health: /healthz
# L'image n'a pas de PUID ni PGID: le container tourne avec l'utilisateur. Son sudo sans mot de
# passe ne marche pas, no-new-privileges l'interdit (J300): code-server ne lit pas /opt/dotbox.
user: "{{uid}}:{{gid}}"
# HOME: sans lui, un uid autre que 1000 (l'utilisateur de l'image) n'a pas de dossier
# personnel, et code-server s'arrête (J300)
env:
  HOME: /home/coder
  TZ: "{{tz}}"
# le dossier personnel dans config/ (réglages, extensions). /opt au même chemin (D67): les
# compose.override.yml et les config/ des apps. /opt/dotbox reste à root seul, /data n'est
# pas monté.
volumes:
  - config:/home/coder
  - /opt:/opt
# le dossier ouvert au démarrage
command:
  - /opt
# Écrits avant le premier démarrage: sans mot de passe, Authelia protège seul. Sans HTTPS,
# Traefik s'en charge.
settings:
  file: config/.config/code-server/config.yaml
  format: yaml
  values:
    bind-addr: 0.0.0.0:8080
    auth: none
    cert: "false"
