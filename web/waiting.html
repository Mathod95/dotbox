<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Box</title>
<style>
:root { color-scheme: dark; --bg: #0a0a0a; --lit: #f0ede6; --label: #9a9a9a; --accent: #10b981; --line: #1d1d1d; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--lit); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background-image: radial-gradient(circle, #161616 1.2px, transparent 1.6px); background-size: 22px 22px; }
main { width: min(560px, 100%); display: grid; gap: 18px; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: #0e0e0e; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .22em; font-size: 15px; }
.brand::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
h1 { margin: 0; font-family: "Fira Code", Consolas, monospace; font-weight: 500; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--label); }
p { margin: 0; color: var(--label); line-height: 1.55; }
b { color: var(--lit); font-weight: 600; }
code { font-family: "Fira Code", Consolas, monospace; font-size: .9em; color: var(--lit); background: #161616; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand">DOT BOX</div>
  <h1>The web interface is coming</h1>
  <p>Welcome, <b>{user}</b>. The gate works: you came through Traefik and Authelia, and the Dot Box service knows who you are.</p>
  <p>The views will arrive one by one. Until then, the <code>dotbox</code> command does everything, over SSH.</p>
  <p>Dot Box <code>{version}</code> · <a href="https://mathod95.github.io/dotbox/getting-started/web-ui/">Web UI in the docs</a></p>
</main>
</body>
</html>
